name: ✅ Tests

# Runs the logic + data-integrity suite on every PR and on pushes to the
# long-lived branches. This is the CI gate; deploy.yml re-runs it before shipping.
on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6
        with:
          node-version: '20'

      - name: ✅ Run logic + data-integrity tests
        run: node --test tests-internal/*.test.js
