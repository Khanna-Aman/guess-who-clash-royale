name: 🚀 Deploy to GitHub Pages

# Deploys automatically on every push to main
# Also triggerable manually via GitHub UI → Actions → Run workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Gate: run the logic tests before anything ships ──────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6
        with:
          node-version: '20'

      - name: ✅ Run logic tests
        run: node --test tests-internal/*.test.js

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: 📦 Collect site files
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -r css js data docs _site/

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
