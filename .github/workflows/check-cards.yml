name: 🃏 Auto-Update Clash Royale Cards

# ─────────────────────────────────────────────────────────────────────────────
# FULLY AUTOMATED — no human action required.
#
# The pipeline runs every Monday at 08:00 UTC. When new cards, hero skins, or
# evolutions are detected, it patches the card data files and commits directly
# to main. That commit then triggers deploy.yml, which republishes GitHub Pages.
#
# Full auto-chain:
#   schedule (Mon 08:00 UTC)
#     → check-new-cards.js  (Gemini + CDN probes)
#       → git commit & push to main  (if anything changed)
#         → deploy.yml fires  (push-to-main trigger)
#           → GitHub Pages updated  ✅  zero human intervention
#
# HOW TO TEST MANUALLY (no need to wait for Monday):
#   GitHub → Actions tab → "🃏 Auto-Update Clash Royale Cards" → Run workflow
#
# FAILURE NOTIFICATIONS:
#   • GitHub emails you automatically on any workflow failure (repo owner)
#   • If the pipeline step itself errors, a GitHub Issue is auto-created
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC
  workflow_dispatch:        # Manually triggerable from the Actions tab

# Principle of least privilege
permissions:
  contents:      write   # Push the auto-update branch
  pull-requests: write   # Open + auto-merge the card-update PR
  issues:        write   # Open failure / stale-source / invalid-key issues

# Never let two card-update runs overlap (they both push to main)
concurrency:
  group: card-update
  cancel-in-progress: false

jobs:
  auto-update-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: true

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: 📦 Install script dependencies (locked versions)
        run: npm ci
        working-directory: .github/scripts

      - name: 🤖 Run auto-update pipeline
        id: pipeline
        run: node .github/scripts/check-new-cards.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Validate the machine-patched data before it can be committed. If the
      # pipeline produced broken JS/JSON or violated a data invariant, fail here
      # so nothing is committed or deployed.
      - name: ✅ Validate patched data (syntax + logic tests)
        if: steps.pipeline.outputs.files_changed == 'true'
        run: |
          node -c js/cards.js
          node -c js/cards-annotations.js
          node -c js/config-filters.js
          node -e "JSON.parse(require('fs').readFileSync('data/CARDS_DATA.json','utf8'))"
          node --test tests-internal/*.test.js

      # Alert if the Gemini key is set but rejected (revoked/expired) — the pipeline
      # self-verifies the key each run, so a dead key is caught early, not months
      # later when a new card silently fails to classify.
      - name: 🔑 Flag invalid Gemini key
        if: steps.pipeline.outputs.gemini_key_invalid == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const label = 'gemini-key-invalid';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              console.log('Invalid-key issue already open — not duplicating.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 🔑 Gemini API key rejected',
              '',
              'The weekly pipeline probed the Gemini API and the key was rejected (revoked, expired, or quota-disabled). The AI-dependent checks (① new-card classification, ③ evolution refresh) cannot run until it is fixed.',
              '',
              '**How to resolve:**',
              '- Generate a fresh **free-tier** key at https://aistudio.google.com/apikey (no billing account linked).',
              '- Update the `GEMINI_API_KEY` repo secret: `Settings → Secrets and variables → Actions`.',
              '- Then close this issue.',
              '',
              `_Raised automatically by the card-update workflow ([run](${runUrl}))._`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '🔑 Gemini API key is invalid — AI card checks are disabled',
              body, labels: [label],
            });

      # If the game already ships permanent cards the upstream source doesn't
      # list, new-card detection is blind (C0). Raise a single deduplicated
      # issue so it never fails silently. Card names are passed via env (not
      # inlined into the script) to avoid any injection.
      - name: ⚠️ Flag stale data source
        if: steps.pipeline.outputs.source_stale == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          STALE_MISSING: ${{ steps.pipeline.outputs.stale_missing }}
          STALE_COUNT: ${{ steps.pipeline.outputs.stale_count }}
        with:
          script: |
            const label = 'data-source-stale';
            const missing = process.env.STALE_MISSING || '(unknown)';
            const count = process.env.STALE_COUNT || '?';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              console.log('Stale-source issue already open — not duplicating.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## ⚠️ Card data source appears frozen',
              '',
              `The upstream new-card source (\`cr-api-data\`) is missing **${count}** permanent card(s) that the game already ships, so **new-card auto-detection (Check ①) cannot see genuinely new cards.**`,
              '',
              '**Cards present in the game but absent upstream:**',
              '',
              '> ' + missing,
              '',
              '**What this means:** hero/evo refresh still works, but newly released cards will NOT be added automatically until the data source is fixed.',
              '',
              '**How to resolve:**',
              '- Point `ROYALE_URL` in `.github/scripts/check-new-cards.js` at a maintained source, **or**',
              '- Add newly released cards manually (see `CONTRIBUTING.md`), then close this issue.',
              '',
              `_Raised automatically by the card-update workflow ([run](${runUrl}))._`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '⚠️ Card data source is stale — new-card auto-detection is blind',
              body, labels: [label],
            });

      # Open a PR (never a direct push to protected main) and enable auto-merge.
      # The PR's required "Test" check must pass before GitHub squash-merges it,
      # which then triggers deploy.yml. This keeps main fully branch-protected
      # while remaining zero-touch.
      - name: 🔀 Open auto-merge PR with updated card files
        if: steps.pipeline.outputs.files_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="auto-update/cards-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add js/cards.js data/CARDS_DATA.json js/cards-annotations.js js/config-filters.js
          if git diff --staged --quiet; then echo "No staged changes — nothing to do."; exit 0; fi
          git commit -m "🃏 auto-update: new CR cards added by pipeline"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "🃏 auto-update: new CR cards" \
            --body "Automated card-data update from the weekly pipeline. Auto-merges once the **Test** check passes." \
            --label "pipeline"
          gh pr merge "$BRANCH" --auto --squash --delete-branch

      - name: ✅ Job Summary
        if: success()
        run: |
          if [ "${{ steps.pipeline.outputs.files_changed }}" = "true" ]; then
            echo "### 🃏 New cards detected — auto-merge PR opened" >> $GITHUB_STEP_SUMMARY
            echo "It will merge automatically once the Test check passes, then deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ No changes — card data is already up to date." >> $GITHUB_STEP_SUMMARY
          fi

      # ── Failure notification ─────────────────────────────────────────────────
      # If ANY step above fails, automatically open a GitHub Issue so you are
      # notified in the repo (in addition to GitHub's default failure email).
      - name: 🚨 Open failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = `🚨 Card update pipeline failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## 🚨 Auto-Update Pipeline Failure',
              '',
              `**Workflow run:** [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '**What to check:**',
              '- Is `GEMINI_API_KEY` still valid? Test it at [Google AI Studio](https://aistudio.google.com/)',
              '- Did the RoyaleAPI data source change format?',
              '- Are there any Node.js errors in the run logs above?',
              '',
              '_This issue was created automatically by the card-update workflow._',
              '_Close it once the problem is resolved._',
            ].join('\n');

            // Check if a failure issue is already open (avoid duplicates)
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure',
            });

            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['pipeline-failure', 'bug'],
              });
            } else {
              console.log('Failure issue already open — skipping duplicate creation.');
            }
